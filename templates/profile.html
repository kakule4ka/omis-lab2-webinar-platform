{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Профиль:</h3>
<div class="row">
    <div class="col-md-3">
        <div class="card shadow-sm p-4 text-center bg-white" style="border-radius: 8px;">
            {% if current_user.profile and current_user.profile.avatar_url and current_user.profile.avatar_url != '/static/avatar.png' %}
                <img src="{{ current_user.profile.avatar_url }}" class="rounded-circle mx-auto mb-3 shadow" style="width: 120px; height: 120px; object-fit: cover;" alt="Аватар">
            {% else %}
                <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center mx-auto mb-3 shadow" style="width: 120px; height: 120px; font-size: 16px;">
                    Аватар
                </div>
            {% endif %}
            <form method="POST" enctype="multipart/form-data">
                <input type="file" name="avatar_file" class="form-control form-control-sm mb-2" required>
                <button type="submit" class="btn btn-outline-dark bg-white text-dark w-100 btn-sm">Загрузить аватар</button>
            </form>
        </div>
    </div>
    <div class="col-md-9">
        <div class="card shadow-sm p-4 bg-white" style="border-radius: 8px;">
            <h4 class="fw-bold mb-4">Данные профиля</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Имя</label>
                    <input type="text" name="name" class="form-control" value="{{ current_user.profile.name if current_user.profile else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Контактный email</label>
                    <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                </div>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Новый пароль</label>
                        <input type="password" name="new_password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Повторите пароль</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4" style="background-color: #2b6cb0;">Сохранить</button>
                    <a href="/events" class="btn btn-outline-secondary px-4">Назад</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
