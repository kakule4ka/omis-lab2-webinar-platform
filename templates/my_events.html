{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Мои мероприятия (Организатор)</h2>
    <a href="/event/create" class="btn btn-success">+ Создать мероприятие</a>
</div>
<div class="row">
    {% for event in events %}
    <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm p-3">
            <h5 class="card-title fw-bold">{{ event.title }}</h5>
            <p class="mb-1"><strong>Дата:</strong> {{ event.date_time }}</p>
            <p class="mb-3"><strong>Статус:</strong> <span class="badge bg-{% if event.status == 'LIVE' %}danger{% else %}primary{% endif %}">{{ event.status }}</span></p>
            <div class="d-flex gap-2 mt-auto">
                <a href="/event/{{ event.id }}" class="btn btn-outline-primary btn-sm">Детали</a>
                <a href="/broadcast/{{ event.id }}" class="btn btn-success btn-sm">Эфир</a>
            </div>
        </div>
    </div>
    {% else %}
    <p class="text-muted">Вы ещё не создали ни одного мероприятия.</p>
    {% endfor %}
</div>
{% endblock %}
